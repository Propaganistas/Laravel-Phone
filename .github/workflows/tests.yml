name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3, 8.4, 8.5 ]
        laravel: [ 11, 12, 13 ]
        stability: [ prefer-lowest, prefer-stable ]
        exclude:
          - laravel: 13
            php: 8.2

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} (${{ matrix.stability }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, json, libxml, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: |
          testbench=$(( ${{ matrix.laravel }} - 2 ))
          composer require "illuminate/support=^${{ matrix.laravel }}" "orchestra/testbench=^${testbench}" --no-interaction --no-update --no-blocking
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress  --no-blocking

      - name: Execute tests
        run: vendor/bin/phpunit
